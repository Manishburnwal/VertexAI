<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" fill="none">
  <title>VertexAI editor preview</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#7c3aed" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 14px; }
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .k { fill: #ff7b72 } .s { fill: #a5d6ff } .f { fill: #d2a8ff } .c { fill: #c9d1d9 } .n { fill: #6e7681 } .m { fill: #8b949e }
    .ln { opacity: 0; animation: lineIn 9s ease-out infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .dot { animation: dots 1.2s ease-in-out infinite; }
    .bubble { opacity: 0; animation: bubbleIn 9s ease-out infinite; }
    @keyframes lineIn { 0% { opacity: 0; transform: translateX(-8px) } 8%, 88% { opacity: 1; transform: translateX(0) } 96%, 100% { opacity: 0 } }
    @keyframes bubbleIn { 0% { opacity: 0; transform: translateY(8px) } 10%, 88% { opacity: 1; transform: translateY(0) } 96%, 100% { opacity: 0 } }
    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes dots { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
  </style>

  <g filter="url(#shadow)">
    <rect x="10" y="10" width="980" height="540" rx="14" fill="#0d1117" stroke="#30363d"/>
  </g>

  <!-- title bar -->
  <path d="M10 24a14 14 0 0 1 14-14h952a14 14 0 0 1 14 14v26H10z" fill="#161b22"/>
  <circle cx="34" cy="30" r="6" fill="#ff5f56"/>
  <circle cx="56" cy="30" r="6" fill="#ffbd2e"/>
  <circle cx="78" cy="30" r="6" fill="#27c93f"/>
  <text class="sans" x="500" y="35" text-anchor="middle" font-size="13" fill="#8b949e">VertexAI  —  server.js</text>

  <!-- sidebar -->
  <rect x="10" y="50" width="220" height="470" fill="#0d1117"/>
  <line x1="230" y1="50" x2="230" y2="520" stroke="#21262d"/>
  <text class="sans" x="28" y="78" font-size="11" font-weight="700" letter-spacing="1.5" fill="#8b949e">EXPLORER</text>
  <g class="sans" font-size="13" fill="#c9d1d9">
    <rect x="22" y="94" width="196" height="26" rx="5" fill="#1f2937"/>
    <rect x="30" y="102" width="10" height="10" rx="2" fill="#fbbf24"/><text x="48" y="112">src</text>
    <rect x="46" y="130" width="10" height="10" rx="2" fill="#38bdf8"/><text x="64" y="140">App.jsx</text>
    <rect x="46" y="156" width="10" height="10" rx="2" fill="#38bdf8"/><text x="64" y="166">Editor.jsx</text>
    <rect x="30" y="184" width="10" height="10" rx="2" fill="#fbbf24"/><text x="48" y="194">services</text>
    <rect x="46" y="210" width="10" height="10" rx="2" fill="#4ade80"/><text x="64" y="220" fill="#e9d5ff" font-weight="600">server.js</text>
    <rect x="46" y="236" width="10" height="10" rx="2" fill="#a78bfa"/><text x="64" y="246">agent.js</text>
    <rect x="30" y="264" width="10" height="10" rx="2" fill="#f472b6"/><text x="48" y="274">docker-compose.yml</text>
    <rect x="30" y="290" width="10" height="10" rx="2" fill="#94a3b8"/><text x="48" y="300">package.json</text>
  </g>

  <!-- tabs -->
  <rect x="231" y="50" width="450" height="34" fill="#161b22"/>
  <rect x="231" y="50" width="130" height="34" fill="#0d1117"/>
  <rect x="231" y="50" width="130" height="2" fill="url(#accent)"/>
  <text class="sans" x="250" y="72" font-size="13" fill="#e6edf3">server.js</text>
  <text class="sans" x="385" y="72" font-size="13" fill="#6e7681">agent.js</text>

  <!-- editor -->
  <g class="mono">
    <g class="n" text-anchor="end">
      <text x="272" y="118">1</text><text x="272" y="142">2</text><text x="272" y="166">3</text><text x="272" y="190">4</text>
      <text x="272" y="214">5</text><text x="272" y="238">6</text><text x="272" y="262">7</text><text x="272" y="286">8</text>
    </g>
    <text class="ln" x="290" y="118" style="animation-delay:0s"><tspan class="k">import</tspan> <tspan class="c">express</tspan> <tspan class="k">from</tspan> <tspan class="s">"express"</tspan><tspan class="c">;</tspan></text>
    <text class="ln" x="290" y="142" style="animation-delay:.4s"><tspan class="k">import</tspan> <tspan class="c">{ graph }</tspan> <tspan class="k">from</tspan> <tspan class="s">"./agent"</tspan><tspan class="c">;</tspan></text>
    <text class="ln" x="290" y="190" style="animation-delay:.8s"><tspan class="k">const</tspan> <tspan class="c">app =</tspan> <tspan class="f">express</tspan><tspan class="c">();</tspan></text>
    <text class="ln" x="290" y="214" style="animation-delay:1.2s"><tspan class="c">app.</tspan><tspan class="f">post</tspan><tspan class="c">(</tspan><tspan class="s">"/generate"</tspan><tspan class="c">,</tspan> <tspan class="k">async</tspan> <tspan class="c">(req, res) =&gt; {</tspan></text>
    <text class="ln" x="290" y="238" style="animation-delay:1.7s"><tspan class="c">  </tspan><tspan class="k">const</tspan> <tspan class="c">code =</tspan> <tspan class="k">await</tspan> <tspan class="c">graph.</tspan><tspan class="f">invoke</tspan><tspan class="c">(req.body);</tspan></text>
    <text class="ln" x="290" y="262" style="animation-delay:2.2s"><tspan class="c">  res.</tspan><tspan class="f">json</tspan><tspan class="c">({ code });</tspan></text>
    <text class="ln" x="290" y="286" style="animation-delay:2.6s"><tspan class="c">});</tspan></text>
    <rect class="cursor" x="326" y="272" width="8" height="18" fill="#a78bfa"/>
    <text class="m" x="290" y="334" opacity="0.6">// AI is generating the next block...</text>
  </g>

  <!-- terminal -->
  <rect x="231" y="380" width="450" height="140" fill="#0a0e14"/>
  <line x1="231" y1="380" x2="681" y2="380" stroke="#21262d"/>
  <text class="sans" x="248" y="402" font-size="11" font-weight="700" letter-spacing="1.5" fill="#8b949e">TERMINAL</text>
  <g class="mono" font-size="13">
    <text x="248" y="430" fill="#4ade80">$ <tspan fill="#c9d1d9">docker compose up -d</tspan></text>
    <text x="248" y="452" fill="#8b949e">✔ auth-service      started</text>
    <text x="248" y="474" fill="#8b949e">✔ ai-service        started</text>
    <text x="248" y="496" fill="#8b949e">✔ api-gateway       listening :8080</text>
  </g>

  <!-- AI panel -->
  <rect x="681" y="50" width="309" height="470" fill="#0f1419"/>
  <line x1="681" y1="50" x2="681" y2="520" stroke="#21262d"/>
  <circle cx="704" cy="76" r="9" fill="url(#aiGrad)"/>
  <text class="sans" x="722" y="81" font-size="14" font-weight="700" fill="#e6edf3">VertexAI Agent</text>
  <circle cx="965" cy="76" r="4" fill="#4ade80"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>

  <g class="bubble" style="animation-delay:.3s">
    <rect x="745" y="104" width="230" height="58" rx="12" fill="url(#accent)"/>
    <text class="sans" x="760" y="128" font-size="13" fill="#ffffff">Create an Express route that</text>
    <text class="sans" x="760" y="148" font-size="13" fill="#ffffff">generates code from a prompt</text>
  </g>

  <g class="bubble" style="animation-delay:1.6s">
    <rect x="697" y="184" width="262" height="122" rx="12" fill="#1a2230" stroke="#2d3748"/>
    <text class="sans" x="712" y="208" font-size="13" fill="#e6edf3">Done! I added a <tspan font-weight="700" fill="#c4b5fd">POST /generate</tspan></text>
    <text class="sans" x="712" y="230" font-size="13" fill="#cbd5e1">endpoint that runs your LangGraph</text>
    <text class="sans" x="712" y="252" font-size="13" fill="#cbd5e1">agent and returns the result.</text>
    <rect x="712" y="268" width="86" height="26" rx="13" fill="#7c3aed"/>
    <text class="sans" x="755" y="285" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Apply</text>
    <rect x="806" y="268" width="86" height="26" rx="13" fill="none" stroke="#475569"/>
    <text class="sans" x="849" y="285" font-size="12" fill="#cbd5e1" text-anchor="middle">Explain</text>
  </g>

  <g class="bubble" style="animation-delay:3s">
    <rect x="697" y="326" width="70" height="32" rx="16" fill="#1a2230" stroke="#2d3748"/>
    <circle class="dot" cx="717" cy="342" r="4" fill="#a78bfa"/>
    <circle class="dot" cx="732" cy="342" r="4" fill="#a78bfa" style="animation-delay:.2s"/>
    <circle class="dot" cx="747" cy="342" r="4" fill="#a78bfa" style="animation-delay:.4s"/>
  </g>

  <rect x="697" y="470" width="278" height="38" rx="19" fill="#161b22" stroke="#30363d"/>
  <text class="sans" x="716" y="494" font-size="13" fill="#6e7681">Ask VertexAI anything...</text>
  <circle cx="951" cy="489" r="12" fill="url(#accent)"/>
  <path d="M946 489h10m-4-4l4 4-4 4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- status bar -->
  <path d="M10 520h980v16a14 14 0 0 1-14 14H24a14 14 0 0 1-14-14z" fill="url(#accent)"/>
  <text class="sans" x="28" y="540" font-size="12" fill="#ffffff">main  •  Node 20  •  Redis connected  •  MongoDB connected</text>
  <text class="sans" x="972" y="540" font-size="12" fill="#ffffff" text-anchor="end">JavaScript  •  UTF-8</text>
</svg>