<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <title>VertexAI banner</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#302b63"/>
      <stop offset="1" stop-color="#1b1b3a"/>
    </linearGradient>
    <linearGradient id="titleGrad" gradientUnits="userSpaceOnUse" x1="440" y1="0" x2="840" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.35" stop-color="#38bdf8"/>
      <stop offset="0.7" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-400 0" to="400 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbA">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="320" rx="0"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .code { font-size: 13px; fill: #a5b4fc; opacity: 0; animation: codeIn 7s ease-in-out infinite; }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .chip { animation: floaty 3.5s ease-in-out infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes codeIn { 0% { opacity: 0 } 15%, 80% { opacity: .38 } 100% { opacity: 0 } }
    @keyframes twinkle { 0%, 100% { opacity: .15 } 50% { opacity: .9 } }
    @keyframes floaty { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    @keyframes pulse { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.5) } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <circle cx="150" cy="70" r="190" fill="url(#orbA)">
      <animate attributeName="cx" values="150;300;150" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;120;70" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="260" r="210" fill="url(#orbB)">
      <animate attributeName="cx" values="1050;900;1050" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="260;200;260" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- stars -->
    <g fill="#ffffff">
      <circle class="star" cx="90" cy="40" r="1.6" style="animation-delay:0s"/>
      <circle class="star" cx="260" cy="280" r="1.4" style="animation-delay:.6s"/>
      <circle class="star" cx="420" cy="48" r="1.2" style="animation-delay:1.2s"/>
      <circle class="star" cx="760" cy="36" r="1.8" style="animation-delay:.3s"/>
      <circle class="star" cx="980" cy="70" r="1.4" style="animation-delay:1.8s"/>
      <circle class="star" cx="1120" cy="180" r="1.6" style="animation-delay:.9s"/>
      <circle class="star" cx="1010" cy="300" r="1.2" style="animation-delay:2.1s"/>
      <circle class="star" cx="60" cy="210" r="1.3" style="animation-delay:1.5s"/>
    </g>

    <!-- faint code, left -->
    <g class="mono">
      <text class="code" x="36" y="70"  style="animation-delay:0s">const agent = new StateGraph();</text>
      <text class="code" x="36" y="96"  style="animation-delay:.5s">agent.addNode("plan", planner);</text>
      <text class="code" x="36" y="122" style="animation-delay:1s">agent.addNode("code", generator);</text>
      <text class="code" x="36" y="148" style="animation-delay:1.5s">await graph.invoke(prompt);</text>
      <!-- faint code, right -->
      <text class="code" x="880" y="70"  style="animation-delay:.8s">app.use("/api", gateway);</text>
      <text class="code" x="880" y="96"  style="animation-delay:1.3s">io.on("connection", sync);</text>
      <text class="code" x="880" y="122" style="animation-delay:1.8s">redis.set(session, token);</text>
      <text class="code" x="880" y="148" style="animation-delay:2.3s">docker compose up -d</text>
    </g>

    <!-- logo -->
    <g transform="translate(0 4)">
      <g stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" filter="url(#glow)">
        <path d="M380 106 L342 174 L418 174 Z" fill="#7c3aed" fill-opacity="0.18"/>
        <path d="M380 106 L380 147 M342 174 L380 147 M418 174 L380 147" stroke="#38bdf8" stroke-opacity="0.8"/>
      </g>
      <circle class="pulse" cx="380" cy="106" r="6" fill="#f472b6"/>
      <circle class="pulse" cx="342" cy="174" r="6" fill="#38bdf8" style="animation-delay:.5s"/>
      <circle class="pulse" cx="418" cy="174" r="6" fill="#a78bfa" style="animation-delay:1s"/>
      <circle cx="380" cy="147" r="4" fill="#ffffff"/>
    </g>

    <!-- title -->
    <text class="sans" x="640" y="170" text-anchor="middle" font-size="86" font-weight="800" fill="url(#titleGrad)" filter="url(#glow)">VertexAI</text>
    <text class="sans" x="640" y="212" text-anchor="middle" font-size="21" letter-spacing="2" fill="#c4b5fd">AI-Powered Code Editor &amp; Development Environment</text>

    <rect x="400" y="228" width="480" height="3" rx="1.5" fill="url(#lineGrad)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- chips -->
    <g class="sans" font-size="14" font-weight="600" text-anchor="middle" fill="#e0e7ff">
      <g class="chip" style="animation-delay:0s"><rect x="213" y="252" width="80" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.6"/><text x="253" y="272">MERN</text></g>
      <g class="chip" style="animation-delay:.3s"><rect x="307" y="252" width="120" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.6"/><text x="367" y="272">LangGraph</text></g>
      <g class="chip" style="animation-delay:.6s"><rect x="441" y="252" width="90" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.6"/><text x="486" y="272">Redis</text></g>
      <g class="chip" style="animation-delay:.9s"><rect x="545" y="252" width="110" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.6"/><text x="600" y="272">Socket.IO</text></g>
      <g class="chip" style="animation-delay:1.2s"><rect x="669" y="252" width="100" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.6"/><text x="719" y="272">Docker</text></g>
      <g class="chip" style="animation-delay:1.5s"><rect x="783" y="252" width="80" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.6"/><text x="823" y="272">AWS</text></g>
      <g class="chip" style="animation-delay:1.8s"><rect x="877" y="252" width="110" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.6"/><text x="932" y="272">Razorpay</text></g>
    </g>
  </g>
</svg>